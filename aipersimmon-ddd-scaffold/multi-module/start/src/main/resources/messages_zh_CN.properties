# Simplified Chinese problem titles. The point of this file is not the translation — it is that a
# second one can exist at all, which is the argument for titleKey being a key and not a literal.
# Selected by the request's Accept-Language (Spring resolves it through LocaleContextHolder), so
# the same error code answers in the caller's language with the same type, code and status.
#
# Keys absent here fall back to messages.properties, so a partial translation degrades to English
# rather than to a raw key.

problem.domain-rule-violation.title=业务规则不允许
problem.resource-not-found.title=资源不存在
problem.resource-conflict.title=当前状态不允许此操作
problem.validation-failed.title=参数校验未通过
problem.unauthorized.title=需要登录
problem.forbidden.title=无此权限
problem.internal-error.title=服务内部错误

ordering.insufficient-credit.title=信用额度不足
