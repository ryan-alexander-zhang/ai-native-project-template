# This file holds the DECISIONS — the settings whose value is the same wherever the application
# runs, because they follow from how the system is built rather than from where it is deployed.
# Anything whose right value depends on the environment (an address, a credential, a timeout tuned
# to a real provider, whether an interactive UI is exposed) lives in application-dev.yml or
# application-prod.yml instead.
#
# The split is worth the two extra files for one reason: a reader can no longer confuse "this is a
# choice you must understand" with "this is my laptop's address". Before it, both were the same
# file and only the comments told them apart.
#
# dev is the default profile, so `mvn spring-boot:run` and the tests behave as they always have.
# Production is an explicit opt-in: SPRING_PROFILES_ACTIVE=prod.
#
# ---------------------------------------------------------------------------------------------
# WHAT IS TUNABLE HERE, AND WHERE IT CAME FROM
#
# Only the decisions this deployment actually made are written out below. The full set of keys is
# not copied here on purpose — it would go stale against the library, and a stale commented-out
# default is worse than none, because uncommenting it pins a value the library has since moved.
# Instead every key carries its type, default and description in the jar: type `aipersimmon.ddd.`
# in this file and the IDE completes the lot. The prose behind each one is in the upstream
# CONFIGURATION.md (README's "Upstream documentation" section has the link).
#
# Which dependency brings which namespace — this is the index to reach for when adding a capability:
#
#   aipersimmon-ddd-starter              aipersimmon.ddd.cqrs, .web, .integration
#   aipersimmon-ddd-starter-mybatis-plus  (the above, plus)
#                                        aipersimmon.ddd.outbox, .inbox, .tenancy, .flyway,
#                                        .operation-log, .process-manager
#   aipersimmon-ddd-starter-messaging-kafka
#                                        aipersimmon.ddd.messaging.kafka
#   aipersimmon-ddd-web-store-mybatis-plus
#                                        aipersimmon.ddd.web.idempotency/replay/rate-limit storage
#   aipersimmon-ddd-openapi-spring-boot-starter
#                                        aipersimmon.ddd.openapi
#
# The namespace is inert until its dependency is on the classpath: nothing under `aipersimmon.ddd`
# does anything on its own, so adding a key without the starter that reads it is silently a no-op.
# ---------------------------------------------------------------------------------------------

spring:
  profiles:
    default: dev
  application:
    name: ordering
  kafka:
    # Serializers are a decision (the transport carries CloudEvents-shaped JSON with String keys),
    # not an environment value; the broker address is, and lives in the profile files.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    # More than one consumer thread so a slow/retrying record on one partition does not stall the
    # others: the integration-event bridge consumes several bounded contexts' topics, and blocking
    # retries would otherwise let one context's backoff delay the rest. Threads are
    # capped by the partition count, so idle threads simply stay unassigned.
    listener:
      concurrency: 3

# Tomcat runs on 8090. Historically because kafka-ui held 8080; that service now sits behind the
# compose `tools` profile, so 8080 is free — the port stays 8090 so existing docs and requests
# keep working.
server:
  port: 8090
  # In-flight requests get to finish when the process is asked to stop, instead of having their
  # connections cut. This matters more here than in a plain CRUD service: a command in flight is
  # inside a transaction that also writes the outbox row, and killing it mid-way means the work is
  # rolled back and retried rather than half-done — but only if the request is allowed to reach
  # its commit. A rolling deployment sends SIGTERM to every instance in turn, so this is the
  # difference between a clean release and a burst of 502s on each one.
  shutdown: graceful

# How the deployment platform asks whether this process is alive and whether it should receive
# traffic. Two different questions, which is the point of the probe split:
#
#   - liveness  = "is this JVM wedged?" If it goes DOWN the platform RESTARTS the pod. It must not
#                 depend on any external system, or an outage of that system turns into a restart
#                 loop that makes the outage worse.
#   - readiness = "can this instance serve a request right now?" If it goes DOWN the platform
#                 stops routing traffic here but leaves the process alone. This one SHOULD depend
#                 on the database, because an instance that cannot reach PostgreSQL cannot serve a
#                 command, and quietly taking it out of the load balancer is exactly right.
#
# Without probes.enabled there is only the single merged /actuator/health, which conflates the two
# and gives the platform no way to tell "restart me" from "skip me for now".
#
# The two settings below are coupled: `readinessState` is a contributor that only exists once
# probes are enabled, so turning probes off while leaving the group listing it fails at STARTUP
# with NoSuchHealthContributorException rather than quietly falling back. That is the better of
# the two failures — a readiness group that silently stopped including readiness would be worse —
# but it is worth knowing before you toggle the flag to see what happens.
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        # health and info only. There is deliberately no `prometheus` here: this application does
        # not expose a scrape endpoint — its Micrometer meters are bridged onto the OpenTelemetry
        # SDK and pushed over OTLP (see the otel block below). Listing an endpoint the app does
        # not have would be cargo cult.
        include: health,info

springdoc:
  # The JSON contract is always served — it is the API's published description, useful in every
  # environment. The interactive Swagger UI is a different question (it is a UI, and it invites
  # writes), so `swagger-ui.enabled` is set per profile: on in dev, off in prod.
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

aipersimmon:
  ddd:
    # CloudEvents `source` FALLBACK: every published contract
    # in this application declares its own on @EventType (source = "/ordering" | "/inventory" |
    # "/payment"), because a process hosting three bounded contexts has no single true answer to
    # "who produced this?" — a shared value made inventory's events claim ordering as their
    # producer, and consumers dedup on the (source, id) pair.
    integration:
      source: ${spring.application.name}
    # The shared Flyway starter applies each component's schema on its own history table
    # (flyway_schema_history_aipersimmon_<component>): the four process-manager tables, the
    # outbox + dead-letter + shedlock tables, and the inbox table.
    #
    # This is the COMPONENT list, which is environment-independent — the application needs the
    # same component schemas wherever it runs. The application's OWN migrations are a separate
    # setting (spring.flyway.locations) and that one IS per profile, because dev additionally
    # loads the demo seed from db/dev.
    flyway:
      components:
        - process-manager
        - outbox
        - inbox
        - operation-log
        - web-store
    # The HTTP edge. Idempotency is on because POST /orders is a create: a client that retries a
    # request whose response it never saw (a timeout, a dropped connection, a user's second click)
    # must not get a second order. The first request under a key runs and its response is stored;
    # a repeat of that key replays the stored response instead of placing another order. The key is
    # scoped per tenant — the filter runs after tenant resolution, and the store's primary key is
    # (tenant_id, idempotency_key), so two tenants may use the same key without colliding.
    #
    # require-key stays false here so the reference app can still be driven with a plain curl. A
    # production API that means it sets require-key=true, which turns a keyless POST into a 400
    # instead of an unprotected write — application-prod.yml does exactly that.
    #
    # allow-in-memory-stores=false is the production posture: the three stateful
    # protections may not silently fall back to per-JVM maps, which the second instance would make
    # useless. With aipersimmon-ddd-web-store-mybatis-plus on the classpath the real store is
    # present, so
    # this only guards against someone removing that dependency — at startup, loudly. It is in the
    # base file, not the prod one, because a fallback that is wrong in production is also wrong in
    # the environment where you would like to find out about it.
    web:
      allow-in-memory-stores: false
      idempotency:
        enabled: true
        header: Idempotency-Key
        ttl: 24h
        require-key: false
    # Integration events cross bounded contexts over Kafka.
    # Routing is per event: each @Externalized event goes to its own named topic
    # (ordering.events / inventory.events / payment.events), and an event with no @Externalized
    # stays in process. The record key is the aggregate subject (per-aggregate ordering);
    # identity/type rides in ce_* headers. consumer.enabled registers the inbox-guarded consumer
    # bridge that subscribes to those topics and republishes each event in process.
    messaging:
      kafka:
        consumer:
          enabled: true
    # The transactional outbox. Two settings here are the ones the framework's production
    # configuration checklist asks to be decided rather than inherited (upstream CONFIGURATION.md,
    # "A production checklist"; README's "Upstream documentation" section has the link):
    #
    #   - the lease: every instance polls, and each claims the rows it is about to dispatch. The
    #     lease length is therefore only "how long a killed instance's rows stay stuck" — the other
    #     instances keep delivering the whole time. Five minutes is short enough that a lost pod is
    #     not noticeable and long enough to cover a GC pause. It does not have to cover a whole
    #     batch: a poll stops after half the lease and hands back what it did not reach. What must
    #     hold is that one send fits in that half — messaging.kafka.producer.send-timeout-ms (30s)
    #     against 2m30s, comfortably. Note batch-size is not part of that arithmetic any more.
    #   - cleanup: on, because a sent row has no further purpose and an outbox that only grows
    #     eventually makes the unsent-row scan slower for no benefit. Seven days of retention is
    #     long enough to answer "did we send it?" during an incident. Leaving it off is a valid
    #     choice too — what is not valid is never having read the question.
    outbox:
      batch-size: 100
      relay:
        lease-duration: PT5M
      cleanup:
        enabled: true
        retention-seconds: 604800
    # The consumer inbox. Retention must exceed the longest redelivery a broker can produce, or a
    # very late duplicate is processed a second time — the one thing the inbox exists to prevent.
    # Thirty days comfortably covers Kafka's default seven-day topic retention: a consumer group
    # reset to the earliest offset replays everything still on the topic, and every one of those
    # records must still be recognised.
    inbox:
      cleanup:
        enabled: true
        retention-seconds: 2592000
        # The same question, asked of this application's own dedupe table, is answered under
        # `payment:` at the bottom of this file — the paragraph above is the reasoning for both.
    # The durable process manager. deadline-worker.poll-delay is how often due timers are looked
    # for, so it bounds how late a timeout fires — the order-fulfilment flow arms a PAYMENT
    # deadline while it waits for the payment context (see OrderFulfilmentDefinition). The worker
    # is on by default; it is named here so it is visible that something fires those timers, and
    # so the polling interval is a deliberate number rather than a default nobody read.
    process-manager:
      deadline-worker:
        poll-delay: 1s
    # Multi-tenancy. enabled=true turns on end-to-end tenant isolation: the web edge
    # resolves the tenant from the X-Tenant-Id header (default HeaderTenantResolver) and binds it for
    # the request; the command bus seeds it onto CommandContext.tenantId; the outbox stamps it onto
    # ce_tenantid and the Kafka consumer reconstructs it — so an async reservation runs under the
    # originating tenant. missing-policy=REJECT fails a header-less request at the edge (400) rather
    # than letting it touch a shared bucket — the safe production posture; a request with no
    # resolvable tenant is treated as malformed. (Actuator/probe traffic carries no tenant; the
    # filter's exclude-paths default already exempts /actuator/**, so probes stay reachable — add
    # your own public paths there if needed.) tenant-tables is the
    # opt-in allow-list the MyBatis-Plus tenant-line interceptor scopes: only these consumer-owned
    # domain tables are rewritten. The framework's background-polled tables (outbox/inbox/process/
    # operation-log) are deliberately absent — they are scanned tenant-lessly by relays and carry
    # their tenant as a stamped data column, not a query predicate.
    tenancy:
      enabled: true
      header: X-Tenant-Id
      # This reference deployment believes the header, which is only defensible behind a component
      # that authenticates the caller and rewrites it (gateway / mesh / BFF). Nothing ties the header
      # to a principal on its own, so trusting it in a directly reachable service would mean anyone
      # can read and write any tenant by changing one header — which is why the framework refuses to
      # start on the default rather than picking a side. A real service usually takes the other
      # option instead: define a TenantResolver bean that reads the verified token claim, and drop
      # this flag. See the upstream CONFIGURATION.md, "Why the tenant header is not trusted by
      # default" (README's "Upstream documentation" section has the link).
      trust-header: true
      missing-policy: REJECT
      # Setting this REPLACES the default, so /actuator/** has to be re-listed. /ops/** is the
      # operator surface (the dead-letter listing and replay): those rows belong to the deployment,
      # not to a tenant — the relay scans the outbox tenant-lessly and each row carries its tenant
      # as data — so requiring a tenant header there would be asking for an answer that has no
      # meaning. A deployment puts /ops/** behind an operator role instead.
      exclude-paths:
        - /actuator/**
        - /ops/**
      mybatis-plus:
        tenant-tables:
          - customers
          - orders
          - order_lines
          - stocks
          - reservations
          - reservation_lines
        # Tables that carry tenant_id but are deliberately NOT interceptor-scoped. The startup
        # guard requires every tenant-carrying table to appear in exactly one of these two lists,
        # because a table in neither gets NO tenant predicate at all — every tenant would see
        # every tenant's rows, silently. payment_operations is written from paths
        # with and without a bound tenant, so MyBatisPaymentOperations stamps and filters the
        # column itself (see its tenant() method and PaymentOperationTenantScopeTest).
        exempt-tables:
          - payment_operations

# OpenTelemetry. What is exported and how it is instrumented is a decision and lives here; WHERE it
# is exported to is an address and lives in the profile files.
otel:
  service:
    name: ${spring.application.name}
  # Bridge the app's Micrometer meters onto the OpenTelemetry SDK so they export over OTLP alongside
  # the traces. Without this the OTEL starter exports only its own instrumentation metrics (jvm.*,
  # http.server.*), and the library's Micrometer SLIs — notably the process-manager gauges
  # (aipersimmon.process.manager.*) the "Aipersimmon DDD · Process Manager" dashboard reads — never
  # reach SigNoz. Also brings hikaricp/executor/tomcat meters across.
  instrumentation:
    micrometer:
      enabled: true
  exporter:
    otlp:
      protocol: grpc
  # Export logs as OTLP too (not just traces): the logback OpenTelemetryAppender (attached in
  # logback-spring.xml, SDK installed by the aipersimmon observability starter) emits each log as a
  # LogRecord to the same collector endpoint above, stamped with the active trace_id/span_id so logs
  # correlate to traces in SigNoz. Tests disable the SDK, so nothing is exported there.
  logs:
    exporter: otlp

# Console logs are structured ECS JSON (Elastic Common Schema) — Spring Boot 3.4+ built-in
# StructuredLogEncoder (see logback-spring.xml). These labels ride on every record so SigNoz / any
# ECS-aware store can filter by service + environment + node. `environment` is per profile: naming
# the environment is the whole point of the label, so a single hard-coded value defeats it.
logging:
  structured:
    ecs:
      service:
        node-name: ${HOSTNAME:localhost}

# This application's own append-only dedupe table. payment_operations records that a
# paymentOperationId has been authorized so a redelivery cannot authorize it twice, which is exactly
# what aipersimmon.ddd.inbox does one layer down — the key is a business id rather than a transport
# message id, but the retention question and its answer are the same one. So this window is the
# inbox's window, not an independently chosen number: it must exceed the longest redelivery the
# broker can produce, because a purged key is a key no longer recognised as a duplicate.
#
# The table had no retention at all until this block existed. It replaced a ConcurrentHashMap, whose
# retention policy — gone on restart — was never written down anywhere, so nothing signalled that
# the swap had removed one. Off is a legitimate answer here (an idempotency log has some audit
# value); having never asked is not.
payment:
  operations:
    cleanup:
      enabled: true
      retention-seconds: 2592000
  # The authorization ceiling: amounts at or below it are authorised, above it declined. A decision,
  # not a local address, so it lives here rather than in a profile.
  #
  # This is configuration because it is a NUMBER a deployment picks. It is not, however, the
  # interesting axis of change: the whole policy is a stand-in for a payment provider, and a real
  # deployment replaces the RULE rather than tuning the threshold. That is a bean, not a property —
  # declare an AuthorizationPolicy and PaymentPolicyConfig's default backs off. Both levels exist
  # because they cost different amounts, and before they did, both meant editing a handler.
  authorization:
    ceiling-minor: 50000

# The ordering context's replaceable policies. Same two levels as payment's: the LIST is a property,
# the RULE is a bean (declare a ManualReviewPolicy and OrderingPolicyConfig's default backs off).
#
# SKU-RESTRICTED is what makes the manual-review branch reachable — an order containing it is held in
# AWAITING_REVIEW until approve-review or reject-review answers. The dev seed stocks it in both
# tenants. An empty list is legitimate and means no order is ever held.
#
# The strings become Sku value objects at startup, so a blank entry fails the context rather than
# silently never matching a line.
ordering:
  review:
    restricted-skus:
      - SKU-RESTRICTED
