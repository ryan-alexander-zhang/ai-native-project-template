# RFC 9457 problem titles, one key per stable error code.
#
# ProblemDescriptor's third argument is a message-source KEY, not the title itself — that is the
# whole reason the parameter is named titleKey. Without this file every key resolved to itself,
# because ProblemTitleResolver falls back to the key rather than failing, so clients received
# "ordering.insufficient-credit.title" in the field RFC 9457 defines as a short human-readable
# summary. Nothing broke loudly: the application started, the requests succeeded, and the machine-
# readable half of the contract (type, code, status) was right the whole time. Only the half meant
# for a person was missing, and only a client author would have noticed.
#
# Spring Boot's MessageSourceAutoConfiguration picks this up from the classpath root under the
# default `messages` basename; messages_zh_CN.properties beside it is resolved by the request's
# Accept-Language, which is what the key indirection buys.

# Category families (aipersimmon-ddd-web DefaultProblemFamilies). Every coded error that does not
# override its descriptor renders one of these, distinguished on the wire by its `code`.
problem.domain-rule-violation.title=Business rule violated
problem.resource-not-found.title=Resource not found
problem.resource-conflict.title=Conflicting state
problem.validation-failed.title=Validation failed
problem.unauthorized.title=Authentication required
problem.forbidden.title=Not permitted
problem.internal-error.title=Internal error

# Per-code overrides declared by OrderingProblemCatalog.
ordering.insufficient-credit.title=Insufficient credit
