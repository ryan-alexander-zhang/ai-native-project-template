# The dev profile — the default (see spring.profiles.default in application.yml), so nothing has
# to be passed to run this locally or to run the tests.
#
# Everything here is an ADDRESS, a CREDENTIAL-FREE local convenience, or a value chosen to make a
# demo watchable. None of it should reach a deployed environment; that is the entire reason these
# lines are not in application.yml.

spring:
  # Local infrastructure (PostgreSQL + Kafka) is started from compose.yaml by Spring Boot's
  # docker-compose support. start-only means the app boots the containers but does NOT tear them
  # down on exit, so `mvn spring-boot:run` iterations are fast and the SigNoz stack (behind the
  # `observability` compose profile, started out-of-band with `docker compose --profile observability
  # up -d`) is left untouched. The DataSource and Kafka bootstrap-servers are auto-wired from the
  # running compose services — which is why this profile needs no spring.datasource block at all,
  # and why application-prod.yml has to supply one.
  #
  # Tests inherit this profile but not the compose behaviour: spring.docker.compose.skip.in-tests
  # defaults to true, and @ServiceConnection supplies the DataSource and broker from Testcontainers
  # at a higher precedence than these values.
  docker:
    compose:
      lifecycle-management: start-only
  kafka:
    bootstrap-servers: localhost:9092
  flyway:
    # The application's own migrations, plus the demo seed. db/migration holds versioned migrations
    # and describes STRUCTURE ONLY; db/dev holds an afterMigrate callback with the CUST-1 / SKU-1
    # demo rows (issue-00072). Splitting them by location is what makes the seed a per-environment
    # decision — a versioned migration runs exactly once in every environment with no way to opt
    # out, so demo data placed there would land in a real production database.
    #
    # application-prod.yml sets this to db/migration alone. That is the whole mechanism.
    locations: classpath:db/migration,classpath:db/dev

# The interactive UI is on locally: it is the fastest way to see the API this scaffold publishes.
springdoc:
  swagger-ui:
    enabled: true

# How long the fulfilment flow waits for the payment context before giving up and compensating
# (release the stock, cancel the order). Two minutes is a development number: long enough that a
# local run never trips it by accident, short enough to watch it happen. A deployment sets it from
# what the payment provider actually promises — see application-prod.yml.
ordering:
  fulfilment:
    payment-timeout: PT2M

# The SigNoz otel-collector listens on the host at 44317 (gRPC) / 44318 (HTTP) when compose is
# started with the `observability` profile — see compose.yaml. Tests disable the SDK entirely
# (otel.sdk.disabled=true in src/test/resources/application.properties), so nothing here is
# reached from a test run.
otel:
  exporter:
    otlp:
      endpoint: http://localhost:44317

logging:
  structured:
    ecs:
      service:
        environment: local
