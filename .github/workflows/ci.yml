# Build and test everything: the DDD building-block library, then the
# multi-module scaffold reference project that depends on it.
#
# The library reactor is installed to the local .m2 first, so the scaffold
# resolves the aipersimmon-ddd-* SNAPSHOTs it imports via the BOM.
name: CI

# Skipped only for changes this job provably never reads. The tempting rule -- "docs and
# scripts cannot affect a Maven artifact, so skip them" -- is wrong here, because this job
# is not only an artifact check. It is also what keeps three documents honest, and each is
# a file someone would classify as "just docs" or "just a script":
#
#   * scripts/check-config-coverage.py is RUN by this job (step 3), and it reads
#     aipersimmon-ddd/CONFIGURATION.md. A config key with metadata and no row there fails
#     the build -- that is the whole point of the step.
#   * ReadmeQuickstartTest EXECUTES the scaffold's README.md: it parses the curl commands
#     out of its fenced bash blocks and runs them against a live app. Editing that
#     quickstart is editing a test fixture.
#   * DocumentationReferenceTest walks the scaffold reactor over .md/.yml/.yaml/.java/
#     .xml/.properties and fails on any *.md reference that would dangle in a generated
#     project. Renaming a markdown file there breaks it from a pure-docs commit.
#
# So the list below is an allow-list of things outside this job's reach, not a pattern
# like '**/*.md' or 'scripts/**'. The two scanning tests are scoped to the scaffold
# (surefire's working directory is the start module, so their root is
# aipersimmon-ddd-scaffold/multi-module), which is what leaves the repository-root docs/
# genuinely untouched by any of it.
#
# The scripts are named one by one rather than globbed, so a script added later runs CI
# until someone decides otherwise -- the safe direction to be wrong in.
#
# GitHub skips a run only when EVERY changed file matches, so a commit touching both a
# document and a pom still builds.
#
# The list is written out twice because GitHub Actions does not support YAML anchors --
# an `&ignored` / `*ignored` pair parses as valid YAML and is rejected by the workflow
# parser. Keep the two copies identical.
on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      # Not built by this job at all -- see the steps below, which cover the library
      # reactor and the multi-module scaffold only.
      - 'aipersimmon-ddd-samples/**'
      - '.github/workflows/publish-library.yml'
      - '.github/workflows/publish-archetype.yml'
      - '.github/workflows/frozen-docs.yml'
      - 'scripts/release.sh'
      - 'scripts/new-app.sh'
      - 'scripts/sync-docs.sh'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'aipersimmon-ddd-samples/**'
      - '.github/workflows/publish-library.yml'
      - '.github/workflows/publish-archetype.yml'
      - '.github/workflows/frozen-docs.yml'
      - 'scripts/release.sh'
      - 'scripts/new-app.sh'
      - 'scripts/sync-docs.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Install the shared quality config
        # Must precede the library build, and the reason is not obvious enough to leave
        # implicit. aipersimmon-ddd-quality-config ships the PMD ruleset and the SpotBugs
        # filter as classpath resources, and the parent declares it inside the PMD
        # <plugin><dependencies>. A plugin's dependencies are resolved from the repository
        # only -- Maven never satisfies them from the reactor, the way it does for ordinary
        # module dependencies. So when the aggregator pom (reactor position 2 of 44) runs
        # PMD, it goes looking for a jar that this very build produces at position 3, and
        # on a runner with an empty ~/.m2 there is nothing to find:
        #
        #   [ERROR] Could not find artifact com.aipersimmon.ddd:aipersimmon-ddd-quality-config
        #
        # Building that one module first with -pl sidesteps it: -pl selects the module
        # alone, so the aggregator's PMD execution never runs, and the jar is installed by
        # the time the full reactor needs it. A developer's machine hides this behind a
        # copy left in ~/.m2 by an earlier build, which is why it only ever failed here.
        run: mvn -B --no-transfer-progress -f aipersimmon-ddd/pom.xml -pl aipersimmon-ddd-quality-config install

      - name: Build and install the building-block library
        run: mvn -B --no-transfer-progress -f aipersimmon-ddd/pom.xml install

      - name: Check every setting is indexed and documented
        # Reads the configuration metadata the build just generated, so it has to follow
        # the library build. A key the code reads but that is missing from either the
        # metadata or CONFIGURATION.md is invisible to whoever configures a deployment,
        # and the failure mode is silence: the setting does nothing and nothing says so.
        run: python3 scripts/check-config-coverage.py

      - name: Build the scaffold reference project
        run: |
          # multi-module runs the full quality gate (Spotless + PMD/SpotBugs + domain
          # coverage/mutation) via `verify`.
          mvn -B --no-transfer-progress -f aipersimmon-ddd-scaffold/multi-module/pom.xml verify
