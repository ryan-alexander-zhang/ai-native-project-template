# Build and test everything: the DDD building-block library, then the
# multi-module scaffold reference project that depends on it.
#
# The library reactor is installed to the local .m2 first, so the scaffold
# resolves the aipersimmon-ddd-* SNAPSHOTs it imports via the BOM.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Install the shared quality config
        # Must precede the library build, and the reason is not obvious enough to leave
        # implicit. aipersimmon-ddd-quality-config ships the PMD ruleset and the SpotBugs
        # filter as classpath resources, and the parent declares it inside the PMD
        # <plugin><dependencies>. A plugin's dependencies are resolved from the repository
        # only -- Maven never satisfies them from the reactor, the way it does for ordinary
        # module dependencies. So when the aggregator pom (reactor position 2 of 44) runs
        # PMD, it goes looking for a jar that this very build produces at position 3, and
        # on a runner with an empty ~/.m2 there is nothing to find:
        #
        #   [ERROR] Could not find artifact com.aipersimmon.ddd:aipersimmon-ddd-quality-config
        #
        # Building that one module first with -pl sidesteps it: -pl selects the module
        # alone, so the aggregator's PMD execution never runs, and the jar is installed by
        # the time the full reactor needs it. A developer's machine hides this behind a
        # copy left in ~/.m2 by an earlier build, which is why it only ever failed here.
        run: mvn -B --no-transfer-progress -f aipersimmon-ddd/pom.xml -pl aipersimmon-ddd-quality-config install

      - name: Build and install the building-block library
        run: mvn -B --no-transfer-progress -f aipersimmon-ddd/pom.xml install

      - name: Check every setting is indexed and documented
        # Reads the configuration metadata the build just generated, so it has to follow
        # the library build. A key the code reads but that is missing from either the
        # metadata or CONFIGURATION.md is invisible to whoever configures a deployment,
        # and the failure mode is silence: the setting does nothing and nothing says so.
        run: python3 scripts/check-config-coverage.py

      - name: Build the scaffold reference project
        run: |
          # multi-module runs the full quality gate (Spotless + PMD/SpotBugs + domain
          # coverage/mutation) via `verify`.
          mvn -B --no-transfer-progress -f aipersimmon-ddd-scaffold/multi-module/pom.xml verify
