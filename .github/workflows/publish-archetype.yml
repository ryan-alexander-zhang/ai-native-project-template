# Publish the multi-module archetype to GitHub Packages.
#
# The archetype is derived from aipersimmon-ddd-scaffold/multi-module rather than
# hand-written, so this workflow derives it fresh on every run: the scaffold is the source
# of truth and a published archetype that drifted from it would be worse than none.
# Consumers who set ARCHETYPE_SOURCE=published (see scripts/new-app.sh) take the archetype
# from here instead of paying for a local library build.
#
# Triggered by a tag, not by a GitHub release and not by hand, and the reason is
# structural rather than stylistic. The `release` and `workflow_dispatch` events read
# their workflow file from the repository's DEFAULT branch, and main here is the
# language-agnostic template skeleton -- it has no aipersimmon-ddd/ at all. A workflow
# sitting on main would have nothing to build. A `push` event, tags included, reads the
# workflow from the tagged commit's own tree, so this file works exactly where the code
# it builds lives.
#
# The tag mirrors the branch: lang/java/ddd -> lang/java/ddd/vX.Y.Z. Tags are repo-global
# while branches are not, so a bare vX.Y.Z would force every future stack -- a Go scaffold
# on lang/go/*, say -- to share one version sequence with this one.
#
#   git tag lang/java/ddd/v0.1.0 && git push origin lang/java/ddd/v0.1.0
#
name: Publish archetype

on:
  push:
    tags: ['lang/java/ddd/v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: github

      - name: Install the shared quality config
        # Same bootstrap the CI workflow needs, and it has to be repeated here because
        # every job gets its own runner and its own empty ~/.m2. aipersimmon-ddd-quality-config
        # is named inside the PMD <plugin><dependencies>, and a plugin's dependencies resolve
        # from the repository only -- never from the reactor -- so the aggregator pom demands
        # at position 2 a jar this build produces at position 3. -DskipTests does not help:
        # PMD is bound to `verify`, which both `install` and `deploy` pass through.
        run: mvn -B --no-transfer-progress -f aipersimmon-ddd/pom.xml -pl aipersimmon-ddd-quality-config install

      # create-from-project cannot even read the scaffold's pom until the imported
      # aipersimmon-ddd-bom resolves: an unresolvable import BOM fails Maven's model
      # building before any goal runs.
      - name: Install the library
        run: mvn -B --no-transfer-progress -DskipTests -f aipersimmon-ddd/pom.xml install

      - name: Derive the archetype
        working-directory: aipersimmon-ddd-scaffold/multi-module
        run: mvn -B --no-transfer-progress archetype:create-from-project -Darchetype.properties=./archetype.properties

      # The derived pom carries no distributionManagement — create-from-project does
      # not invent one — so name the target repository explicitly. The `github` id
      # matches the server setup-java wrote into settings.xml, and the URL matches
      # aipersimmon-ddd/pom.xml's distributionManagement.
      - name: Deploy to GitHub Packages
        run: >
          mvn -B --no-transfer-progress
          -f aipersimmon-ddd-scaffold/multi-module/target/generated-sources/archetype/pom.xml
          deploy
          -DaltDeploymentRepository=github::https://maven.pkg.github.com/ryan-alexander-zhang/ai-native-project-template
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
