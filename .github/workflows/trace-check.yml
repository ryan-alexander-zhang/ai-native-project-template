# Docs<->code traceability gate (decision-90001-trace-ids-and-trace-check).
# Runs on every branch: ids, relations, FR/BR coverage, AC test suffixes,
# record evidence, resolved-plan gate. See scripts/trace-check --help text.
name: trace-check

on: [push, pull_request]

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # verified_against ages and --impact ranges need history
      - name: Self-test the checker
        run: python3 scripts/test_trace_check.py
      - name: Check traceability
        run: scripts/trace-check
      - name: Self-test and run the canonical-term gate (decision-90005)
        run: |
          python3 scripts/test_term_check.py
          scripts/term-check
      - name: Spec impact of this PR (decision-90004)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          { echo '## Spec impact'; echo '```'; scripts/trace-check --impact "origin/${{ github.base_ref }}..HEAD"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
