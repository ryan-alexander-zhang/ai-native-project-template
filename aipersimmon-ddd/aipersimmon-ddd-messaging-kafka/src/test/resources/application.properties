# Tests reuse the shipped inbox Flyway migrations (from aipersimmon-ddd-inbox, via inbox-jdbc) as
# the single source of the schema, instead of a separate test-only schema.sql.
#
# Matched by pattern, not listed by name, on purpose: this module BORROWS a schema it does not own,
# so a hand-written list here silently rots when the owner adds a migration — which is exactly what
# happened when multi-tenancy added V2__add_tenant_id and left three integration tests timing out
# forever (issue-00056). Every other module lists its own migrations, where adding one and updating
# the list happen in the same commit.
#
# Known boundary: matched resources are ordered by string sort, so a hypothetical V10 would run
# before V2. The inbox has 2 migrations and no framework component has more than 3; revisit if that
# ever approaches V10.
spring.sql.init.schema-locations=classpath*:aipersimmon/db/migration/inbox/h2/V*.sql
