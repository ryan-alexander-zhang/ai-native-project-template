# Tests reuse the shipped web-store Flyway migrations (from aipersimmon-ddd-web) as the single
# source of the schema, instead of a separate test-only schema.sql. Listed one by one rather than by
# V*.sql pattern: these four must run in order, and a pattern's resolution order is not guaranteed.
# Every new migration has to be appended here.
spring.sql.init.schema-locations=classpath:aipersimmon/db/migration/web-store/h2/V1__aipersimmon_web_store.sql,classpath:aipersimmon/db/migration/web-store/h2/V2__add_tenant_id.sql,classpath:aipersimmon/db/migration/web-store/h2/V3__idempotency_claim.sql,classpath:aipersimmon/db/migration/web-store/h2/V4__rate_limit_window_index.sql
