# Tests reuse the shipped inbox Flyway migrations (from aipersimmon-ddd-inbox) as the single
# source of the schema, instead of a separate test-only schema.sql. Matched by pattern, not listed
# one by one: this module BORROWS a schema it does not own, so a migration added over there must
# not need a matching edit here to be picked up (that drift was issue-00056).
spring.sql.init.schema-locations=classpath*:aipersimmon/db/migration/inbox/h2/V*.sql
