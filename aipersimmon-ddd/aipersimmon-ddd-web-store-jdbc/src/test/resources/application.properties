# Tests reuse the shipped web-store Flyway migrations as the single source of the schema, instead of a
# separate test-only schema.sql. Every new migration has to be appended here, in order.
spring.sql.init.schema-locations=classpath:aipersimmon/db/migration/web-store/h2/V1__aipersimmon_web_store.sql,classpath:aipersimmon/db/migration/web-store/h2/V2__add_tenant_id.sql,classpath:aipersimmon/db/migration/web-store/h2/V3__idempotency_claim.sql
