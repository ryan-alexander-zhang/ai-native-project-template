spring:
  application:
    # Also the inbox's `consumer` identity and the Kafka consumer group. Two services sharing one inbox
    # table and one name would suppress each other's processing of the same message.
    name: s22-inventory-service
  datasource:
    url: jdbc:postgresql://localhost:18223/inventory
    username: inventory
    password: inventory
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:18224
    consumer:
      auto-offset-reset: earliest
    producer:
      properties:
        # A consumer needs a producer too: dead-lettering a record is a publish to <topic>.DLT. If that
        # topic is missing, this bound is how long the recovery attempt blocks before failing — and while
        # it blocks, the partition is doing nothing at all. Sixty seconds (the default) turns "the DLT was
        # never provisioned" into a stall that advances one attempt per minute.
        max.block.ms: 5000

server:
  port: 18222

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

inventory:
  ordering-events-topic: s22.ordering.events

aipersimmon:
  ddd:
    integration:
      source: /inventory
    flyway:
      # The inbox, and only the inbox — which is the interesting part for an operability sample. This
      # service used to provision aipersimmon_outbox, aipersimmon_dead_letter and shedlock and never
      # write a row into any of them, because the durable-transport guard read its subscriptions as
      # publications (issue-00161, fixed). Three tables, a schema validator and a disabled relay, all
      # to satisfy a check about something this service does not do.
      components: [inbox]
    messaging:
      kafka:
        # The one thing the framework cannot work out: @Externalized means "where this goes" on a
        # publisher and "which topic to subscribe to" on a consumer, and nothing distinguishes them —
        # there is no static evidence of a call to IntegrationEvents.publish. So a consumer says so, and
        # the default (true) stays strict, because a real publisher with no durable transport loses
        # events with nothing to notice: no exception, no dead letter, no consumer lag.
        publishes-externalized-events: false
        consumer:
          # Off by default in the library, because producing and consuming are separate decisions.
          enabled: true
          # Three retries then the dead-letter topic. This is the ONLY bound that keeps an unforeseen
          # always-failing record from owning a partition, so it is the number to think about hardest:
          # too high and a poison record blocks everything behind it for minutes; too low and a genuinely
          # transient fault (a lock timeout, a leader election) dead-letters healthy work.
          retry:
            max-retries: 3
            initial-interval-ms: 200
            multiplier: 2.0
            max-interval-ms: 800
          # A DataAccessException is treated as the environment being down: retried at this interval
          # FOREVER and never dead-lettered. The partition waits at the record until the cause is fixed,
          # which is the deliberate trade — an outage does not flush a healthy backlog into the DLT, and
          # in exchange nothing behind the record is consumed until someone acts. This interval is also
          # the report cadence for the WARN that says so, which is the only signal that a partition is
          # stalled rather than idle.
          systemic-backoff-interval-ms: 1000
    # NOTE the absence again: aipersimmon.ddd.inbox.cleanup.* is unset, so the dedup table is never
    # purged. Unlike the outbox's, this retention is a CORRECTNESS setting rather than a storage one —
    # once a key is purged, a later redelivery of that same message is no longer recognised as a
    # duplicate and is processed again. The window must therefore exceed the longest time anything could
    # still redeliver: the broker's retention, plus a consumer group that gets reset, plus a dead letter
    # someone replays next week. InboxRetentionTest measures what a too-short window costs. A production
    # deployment sets:
    #   inbox:
    #     cleanup:
    #       enabled: true
    #       retention-seconds: 2592000   # 30 days, and pick it from the longest redelivery path
