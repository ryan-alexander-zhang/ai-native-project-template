spring:
  application:
    # Several components derive defaults from this, so it is set rather than left blank.
    name: s01-http-command-query
  datasource:
    url: jdbc:postgresql://localhost:18011/s01
    username: s01
    password: s01
  flyway:
    # Boot's Flyway manages the business schema; the audit table's DDL lives inside the component's
    # jar and is applied by the framework's migrator — see aipersimmon.ddd.flyway.components below.
    enabled: true
    locations: classpath:db/migration

server:
  port: 18010

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

aipersimmon:
  ddd:
    flyway:
      # The audit table, and only it. This sample publishes nothing and consumes nothing, so it owns
      # no outbox and no inbox.
      components: [operation-log]
    operation-log:
      # Left to default to spring.application.name. It is the logical writer of every row and part of
      # the idempotency key's scope, so two services sharing a database keep their audit trails apart
      # without agreeing on anything.
      source: s01-http-command-query
