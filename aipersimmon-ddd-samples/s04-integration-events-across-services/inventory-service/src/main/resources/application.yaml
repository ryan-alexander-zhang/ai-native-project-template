spring:
  application:
    # Also the inbox's `consumer` identity and the Kafka consumer group. Two services sharing one
    # inbox table and one name would suppress each other's processing of the same message.
    name: s04-inventory-service
  datasource:
    url: jdbc:postgresql://localhost:18043/inventory
    username: inventory
    password: inventory
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:18044
    consumer:
      auto-offset-reset: earliest

server:
  port: 18042

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

inventory:
  ordering-events-topic: ordering.events

aipersimmon:
  ddd:
    integration:
      source: /inventory
    flyway:
      # The inbox, and only the inbox. A consumer has no outbox: the tables, the relay and the
      # dead-letter machinery all belong to whoever publishes.
      #
      # It used to have one. The durable-transport guard read this service's @Externalized declarations
      # — which are SUBSCRIPTIONS, since that annotation is how the bridge derives its topic set — as
      # publications, and refused to start without a durable publisher. issue-00161, fixed: the
      # messaging module now takes the one statement the framework cannot infer, below.
      components: [inbox]
    messaging:
      kafka:
        # The one thing the framework cannot work out: @Externalized means "where this goes" on a
        # publisher and "which topic to subscribe to" on a consumer, and nothing distinguishes them —
        # there is no static evidence of a call to IntegrationEvents.publish. So a consumer says so, and
        # the default (true) stays strict, because a real publisher with no durable transport loses
        # events with nothing to notice: no exception, no dead letter, no consumer lag.
        publishes-externalized-events: false
        consumer:
          # Off by default in the library, because producing and consuming are separate decisions.
          # This service is a consumer, so it says so.
          enabled: true
    # S13. The consuming side has two trusted boundaries, not one: the HTTP edge (the read endpoint)
    # and the message consumer. The bridge binds the tenant from ce_tenantid before it touches the
    # database — which is why a record that carries no tenant is rejected rather than attributed.
    tenancy:
      enabled: true
      trust-header: true
      mybatis-plus:
        # Only the domain table. aipersimmon_inbox carries tenant_id too, and is exempt by
        # construction: its rows are written from a bound thread but its cleanup job polls with no
        # tenant at all, so a predicate on it would make cleanup throw.
        tenant-tables: [s04_stock]

# S15, consuming end. Exporters off for the same reason as the publisher: a sample has no collector.
otel:
  service:
    name: s04-inventory-service
  traces:
    exporter: none
  metrics:
    exporter: none
  logs:
    exporter: none
