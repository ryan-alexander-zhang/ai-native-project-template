spring:
  application:
    # Also the outbox relay's ShedLock lock name and the Kafka consumer group default. Naming a
    # service is not cosmetic here.
    name: s04-ordering-service
  datasource:
    url: jdbc:postgresql://localhost:18041/ordering
    username: ordering
    password: ordering
  flyway:
    # This service's own schema. The framework's is a separate runner with its own history table.
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:18044

server:
  port: 18040

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

ordering:
  events-topic: ordering.events

aipersimmon:
  ddd:
    integration:
      # The fallback provenance stamped on any event whose @EventType leaves `source` empty. Both of
      # this service's events name their own, so this is belt and braces — but a deployment hosting
      # several contexts cannot rely on a single default, which is why the annotation wins.
      source: /ordering
    flyway:
      # The switch the catalogue asked to see explicitly. Omit `outbox` and the migrations sit unused
      # on the classpath; the outbox's own schema validator then refuses to start, naming this
      # property — which is the good failure, because the alternative is a command rolling back at
      # runtime on its first publication.
      components: [outbox]
    outbox:
      relay:
        # On in a real deployment. The tests turn it off so a single poll can be driven and asserted
        # on; the library documents exactly this use.
        enabled: true
      poll-delay-ms: 500
    messaging:
      kafka:
        producer:
          send-timeout-ms: 10000
    # S13. Inert until this flag is on, so bundling the two tenancy artifacts costs nothing at N=1.
    tenancy:
      enabled: true
      # Affirming that the X-Tenant-Id header may be believed. The library refuses to start on the
      # default (false) with no TenantResolver bean of its own, and it is right to: the header is
      # client-supplied and nothing ties it to an authenticated principal, so trusting it means any
      # caller who can reach this service reads and writes any tenant's data by editing one header.
      # It holds only while a gateway/mesh/BFF authenticates the caller and REWRITES the header,
      # discarding whatever arrived — and only while this service cannot be reached around it. A real
      # deployment that cannot promise that resolves the tenant from the principal instead, by
      # defining a TenantResolver bean, and leaves this false.
      trust-header: true
      mybatis-plus:
        # The allow-list, and the deliberate act. It fails OPEN — an unlisted table gets no tenant
        # predicate at all, on reads as well as writes — which is why the library also runs a startup
        # guard that refuses to boot when a table carrying tenant_id appears in neither list. The
        # framework's own aipersimmon_* tables are exempt by construction: a relay polls them with no
        # request tenant, and each row carries its tenant as stamped data rather than as a predicate.
        tenant-tables: [s04_order, s04_order_line]

# S15. The SDK is on because the aipersimmon observability starter is a dependency; the exporters are
# off because a sample has no collector to reach, and an OTLP exporter retrying against nothing is
# noise in every test log. Spans are still created and sampled, which is all the store-and-forward
# capture needs — a deployment sets `traces.exporter: otlp` and an endpoint instead.
otel:
  service:
    name: s04-ordering-service
  traces:
    exporter: none
  metrics:
    exporter: none
  logs:
    exporter: none
