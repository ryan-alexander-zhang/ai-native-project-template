spring:
  application:
    # Also the inbox's `consumer` identity and the Kafka consumer group. Two services sharing one inbox
    # table and one name would suppress each other's processing of the same message.
    name: s12-ordering-service
  datasource:
    url: jdbc:postgresql://localhost:18121/ordering
    username: ordering
    password: ordering
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:18124
    consumer:
      auto-offset-reset: earliest

server:
  port: 18120

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

ordering:
  catalog-events-topic: catalog.events

aipersimmon:
  ddd:
    integration:
      source: /ordering
    flyway:
      # The inbox, and only the inbox. This service publishes nothing, so it owns no outbox.
      #
      # It carried one under protest until issue-00161 was fixed: the durable-transport guard read the
      # @Externalized on this service's copy of the rename contract as a publication, when it is a
      # subscription — that annotation is how the bridge derives its topic set. The statement the
      # framework cannot infer is now a property of its own, below.
      components: [inbox]
    messaging:
      kafka:
        # The one thing the framework cannot work out: @Externalized means "where this goes" on a
        # publisher and "which topic to subscribe to" on a consumer, and nothing distinguishes them —
        # there is no static evidence of a call to IntegrationEvents.publish. So a consumer says so, and
        # the default (true) stays strict, because a real publisher with no durable transport loses
        # events with nothing to notice: no exception, no dead letter, no consumer lag.
        publishes-externalized-events: false
        consumer:
          # Off by default in the library: producing and consuming are separate decisions. This service
          # consumes.
          enabled: true

logging:
  level:
    com.example.samples.s12: INFO
