# Docs whiteboard flow config — the machine-readable carrier of rule-00001-docs-workflow.
# Carries the type split (BR-1) and the product flow (BR-13…BR-17).
# The status transition table (BR-2…BR-9), the clarifiable set (BR-20), the
# auditable set (BR-23), and the resolved gate (BR-24, BR-25) are built into the
# code and are not configured here.

# The declaration order below IS the whiteboard's column order, left to right
# (decision-00002-whiteboard-layout §2). Reordering these lines reorders the
# board; add a new type at the position you want its column to appear.
types:
  idea: { kind: living }
  prd: { kind: living }
  analysis: { kind: living }
  reference: { kind: living }
  integration: { kind: living }
  spec: { kind: living }
  rule: { kind: living }
  decision: { kind: living }
  design: { kind: living }
  plan: { kind: work }
  task: { kind: work }
  issue: { kind: work }
  record: { kind: living }
  report: { kind: living }
  operation: { kind: living }
  prompt: { kind: living }

relations:
  - parent
  - implements
  - informs
  - motivated_by
  - constrains
  - blocks
  - verifies
  - supersedes

flow:
  idea:
    - { next: prd, carry: parent }
    - { next: spec, carry: parent }
  prd:
    - { next: spec, carry: parent }
  spec:
    - { next: rule, carry: informs }
    - { next: design, carry: informs }
    - { next: plan, carry: implements }
  plan:
    - { next: task, carry: parent }
    - { next: issue, carry: blocks }
    - { next: record, carry: parent }

# Focus lines (spec-00001-FR-48): one line per clarifiable type, the questioning
# weight a clarify session leans on. The clarifiable set — idea, prd, spec, rule,
# design (rule-00001-BR-20) — is built into the code, and the shared questioning
# skeleton with it; this file owns only the one line per type, so the weight is
# yours to retune at any time. A clarifiable type with no line here, or a line
# given to any other type, refuses to start the board.
focus:
  idea: Whether it is worth doing and for whom — how real the pain is, who is hit, and the cost of not doing it.
  prd: Actors, scope, and the value trade-off — who it serves, what this version keeps out, and why it goes first.
  spec: FR boundaries and acceptance gaps — failure paths, edge inputs, and an observable criterion for every FR.
  rule: The branches the decision table misses — value combinations across dimensions, the default row, and who wins on conflict.
  design: Structural trade-offs and failure modes — the rejected options, the module boundaries, and how the system behaves when it breaks.

agents:
  claude:
    command: claude
    # Write-scope constraint: the session runs with docs/ as its working directory.
    # Any CLI added here must first be verified against spec-00001-AC-13.2
    # (a write outside docs/ must not land) before it ships in this file.
    args: []
    cwd: docs
